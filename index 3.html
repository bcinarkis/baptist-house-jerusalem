<script>
function setLang(l) {
  document.documentElement.lang = l;
  document.documentElement.dir = l === 'he' ? 'rtl' : 'ltr';

  document.querySelectorAll('[data-en]').forEach(function(x) {
    x.innerHTML = x.dataset[l];
  });

  document.getElementById('en').classList.toggle('active', l === 'en');
  document.getElementById('he').classList.toggle('active', l === 'he');
}
</script>
